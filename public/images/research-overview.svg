<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans','Avenir Next','Segoe UI',sans-serif">
  <title id="title">Murat Keceli — Research Overview</title>
  <desc id="desc">Using supercomputers and AI to discover new molecules and materials for a cleaner, smarter future.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ec"/>
      <stop offset="100%" stop-color="#dceee9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#06403c"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .h1 { font-size: 64px; font-weight: 800; fill: #0b1d1f; font-family: 'Iowan Old Style','Palatino Linotype','Book Antiqua',serif; }
      .h2 { font-size: 30px; fill: #0b1d1f; opacity: 0.78; }
      .tag { font-size: 22px; fill: #0b1d1f; opacity: 0.85; }
      .cap { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 18px; fill: #ffffff; opacity: 0.92; }
      .hub-label { font-size: 26px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .hub-sub  { font-size: 17px; fill: #ffffff; opacity: 0.9; text-anchor: middle; }
      .pill-title { font-size: 26px; font-weight: 800; fill: #0b1d1f; }
      .pill-body  { font-size: 18px; fill: #0b1d1f; opacity: 0.85; }
      .impact-title { font-size: 22px; font-weight: 800; fill: #0b1d1f; }
      .impact-body  { font-size: 16px; fill: #0b1d1f; opacity: 0.82; }
      .footer { font-size: 22px; fill: #0b1d1f; opacity: 0.7; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- decorative wavy connections -->
  <g opacity="0.10" stroke="url(#accent)" stroke-width="3" fill="none">
    <path d="M0 720 C 300 600, 600 820, 960 700 S 1620 580, 1920 700"/>
    <path d="M0 820 C 350 700, 700 900, 960 800 S 1600 700, 1920 820"/>
    <path d="M0 920 C 400 820, 700 980, 960 900 S 1600 820, 1920 920"/>
  </g>

  <!-- header -->
  <g>
    <text x="80" y="100" class="h2">Murat Keçeli  •  Computational Scientist  •  Argonne National Laboratory</text>
    <text x="80" y="180" class="h1">Simulating molecules. Training AI. Solving real problems.</text>
    <text x="80" y="226" class="tag">How we use supercomputers and artificial intelligence to design a cleaner, smarter future.</text>
    <line x1="80" y1="250" x2="1840" y2="250" stroke="url(#accent)" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- ====== THREE PILLARS ====== -->
  <g transform="translate(0,300)">

    <!-- Pillar 1: Computational Chemistry -->
    <g transform="translate(80,0)">
      <rect width="540" height="280" rx="22" fill="#ffffff" opacity="0.78" stroke="#0f766e" stroke-width="2"/>
      <!-- icon: molecule -->
      <g transform="translate(70,140)">
        <line x1="-40" y1="-40" x2="0"   y2="0"   stroke="#0f766e" stroke-width="4"/>
        <line x1="0"   y1="0"   x2="55"  y2="-30" stroke="#0f766e" stroke-width="4"/>
        <line x1="0"   y1="0"   x2="20"  y2="55"  stroke="#0f766e" stroke-width="4"/>
        <line x1="55"  y1="-30" x2="100" y2="10"  stroke="#0f766e" stroke-width="4"/>
        <circle cx="-40" cy="-40" r="14" fill="#b45309"/>
        <circle cx="0"   cy="0"   r="18" fill="#0f766e"/>
        <circle cx="55"  cy="-30" r="14" fill="#0f766e"/>
        <circle cx="20"  cy="55"  r="12" fill="#b45309"/>
        <circle cx="100" cy="10"  r="14" fill="#b45309"/>
      </g>
      <text x="200" y="80" class="pill-title">Computational Chemistry</text>
      <text x="200" y="115" class="pill-body">Solve the equations that describe how</text>
      <text x="200" y="140" class="pill-body">atoms vibrate, bond, and react — without</text>
      <text x="200" y="165" class="pill-body">ever stepping into a lab.</text>
      <text x="200" y="210" class="pill-body" font-style="italic" opacity="0.7">Quantum mechanics • vibrations</text>
      <text x="200" y="235" class="pill-body" font-style="italic" opacity="0.7">chemical reactions • thermochemistry</text>
    </g>

    <!-- Pillar 2: Supercomputers / HPC -->
    <g transform="translate(690,0)">
      <rect width="540" height="280" rx="22" fill="#ffffff" opacity="0.78" stroke="#0f766e" stroke-width="2"/>
      <!-- icon: server racks -->
      <g transform="translate(50,80)">
        <rect x="0"  y="0"  width="40" height="120" rx="6" fill="#0f766e"/>
        <rect x="55" y="0"  width="40" height="120" rx="6" fill="#0f766e"/>
        <rect x="110" y="0" width="40" height="120" rx="6" fill="#0f766e"/>
        <g fill="#f7f4ec">
          <rect x="6" y="10"  width="28" height="6" rx="2"/>
          <rect x="6" y="22"  width="28" height="6" rx="2"/>
          <rect x="6" y="34"  width="28" height="6" rx="2"/>
          <rect x="6" y="46"  width="28" height="6" rx="2"/>
          <rect x="61" y="10" width="28" height="6" rx="2"/>
          <rect x="61" y="22" width="28" height="6" rx="2"/>
          <rect x="61" y="34" width="28" height="6" rx="2"/>
          <rect x="61" y="46" width="28" height="6" rx="2"/>
          <rect x="116" y="10" width="28" height="6" rx="2"/>
          <rect x="116" y="22" width="28" height="6" rx="2"/>
          <rect x="116" y="34" width="28" height="6" rx="2"/>
          <rect x="116" y="46" width="28" height="6" rx="2"/>
        </g>
        <g fill="#b45309">
          <circle cx="20"  cy="100" r="4"/>
          <circle cx="75"  cy="100" r="4"/>
          <circle cx="130" cy="100" r="4"/>
        </g>
      </g>
      <text x="240" y="80" class="pill-title">Supercomputers</text>
      <text x="240" y="115" class="pill-body">Write software that runs on millions</text>
      <text x="240" y="140" class="pill-body">of processors at once — fast enough</text>
      <text x="240" y="165" class="pill-body">to simulate the impossible.</text>
      <text x="240" y="210" class="pill-body" font-style="italic" opacity="0.7">Exascale computing • parallel algorithms</text>
      <text x="240" y="235" class="pill-body" font-style="italic" opacity="0.7">NWChemEx • ELSI • SIESTA-SIPs</text>
    </g>

    <!-- Pillar 3: AI for Science -->
    <g transform="translate(1300,0)">
      <rect width="540" height="280" rx="22" fill="#ffffff" opacity="0.78" stroke="#0f766e" stroke-width="2"/>
      <!-- icon: neural net / chip -->
      <g transform="translate(70,140)">
        <circle cx="0"   cy="-50" r="10" fill="#b45309"/>
        <circle cx="0"   cy="0"   r="10" fill="#b45309"/>
        <circle cx="0"   cy="50"  r="10" fill="#b45309"/>
        <circle cx="60"  cy="-30" r="10" fill="#0f766e"/>
        <circle cx="60"  cy="30"  r="10" fill="#0f766e"/>
        <circle cx="120" cy="0"   r="12" fill="#b45309"/>
        <g stroke="#0f766e" stroke-width="2" opacity="0.7">
          <line x1="0" y1="-50" x2="60" y2="-30"/>
          <line x1="0" y1="-50" x2="60" y2="30"/>
          <line x1="0" y1="0"   x2="60" y2="-30"/>
          <line x1="0" y1="0"   x2="60" y2="30"/>
          <line x1="0" y1="50"  x2="60" y2="-30"/>
          <line x1="0" y1="50"  x2="60" y2="30"/>
          <line x1="60" y1="-30" x2="120" y2="0"/>
          <line x1="60" y1="30"  x2="120" y2="0"/>
        </g>
      </g>
      <text x="230" y="80" class="pill-title">AI for Science</text>
      <text x="230" y="115" class="pill-body">Build AI agents and large language</text>
      <text x="230" y="140" class="pill-body">models that read papers, run code,</text>
      <text x="230" y="165" class="pill-body">and help scientists discover faster.</text>
      <text x="230" y="210" class="pill-body" font-style="italic" opacity="0.7">ChemGraph • AuroraGPT • AskHPC</text>
      <text x="230" y="235" class="pill-body" font-style="italic" opacity="0.7">neural network potentials</text>
    </g>
  </g>

  <!-- ====== CENTRAL HUB + IMPACT ORBIT ====== -->
  <g transform="translate(960,790)">
    <!-- connection lines from hub to impact bubbles -->
    <g stroke="#0f766e" stroke-width="2" opacity="0.45" fill="none">
      <line x1="0" y1="0" x2="-700" y2="0"/>
      <line x1="0" y1="0" x2="-360" y2="0"/>
      <line x1="0" y1="0" x2="360"  y2="0"/>
      <line x1="0" y1="0" x2="700"  y2="0"/>
    </g>

    <!-- central hub -->
    <circle cx="0" cy="0" r="110" fill="url(#hub)"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#b45309" stroke-width="2" opacity="0.6"/>
    <text x="0" y="-12" class="hub-label">Real-World</text>
    <text x="0" y="22"  class="hub-label">Impact</text>
    <text x="0" y="56"  class="hub-sub">where the science goes</text>

    <!-- Impact 1: Clean Energy / CO2 -->
    <g transform="translate(-700,0)">
      <circle r="95" fill="#0f766e"/>
      <text y="-22" text-anchor="middle" class="cap">Capturing</text>
      <text y="4"   text-anchor="middle" class="cap">CO₂</text>
      <text y="32"  text-anchor="middle" class="sub">designing materials to</text>
      <text y="54"  text-anchor="middle" class="sub">pull carbon from the air</text>
    </g>

    <!-- Impact 2: Cleaner Fuels -->
    <g transform="translate(-360,0)">
      <circle r="95" fill="#b45309"/>
      <text y="-22" text-anchor="middle" class="cap">Cleaner</text>
      <text y="4"   text-anchor="middle" class="cap">Fuels</text>
      <text y="32"  text-anchor="middle" class="sub">predicting how fuels</text>
      <text y="54"  text-anchor="middle" class="sub">burn — atom by atom</text>
    </g>

    <!-- Impact 3: Smarter Materials -->
    <g transform="translate(360,0)">
      <circle r="95" fill="#b45309"/>
      <text y="-22" text-anchor="middle" class="cap">Smarter</text>
      <text y="4"   text-anchor="middle" class="cap">Materials</text>
      <text y="32"  text-anchor="middle" class="sub">2D materials, batteries,</text>
      <text y="54"  text-anchor="middle" class="sub">and water filters</text>
    </g>

    <!-- Impact 4: Fighting Wildfires -->
    <g transform="translate(700,0)">
      <circle r="95" fill="#0f766e"/>
      <text y="-22" text-anchor="middle" class="cap">Fighting</text>
      <text y="4"   text-anchor="middle" class="cap">Wildfires</text>
      <text y="32"  text-anchor="middle" class="sub">AI + drones to detect</text>
      <text y="54"  text-anchor="middle" class="sub">fires in Alaska</text>
    </g>
  </g>

  <!-- footer tagline -->
  <g>
    <text x="80" y="1040" class="footer">keceli.github.io  •  Computational Science Division, Argonne National Laboratory</text>
  </g>
</svg>
