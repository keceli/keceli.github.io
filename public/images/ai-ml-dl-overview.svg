<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, Avenir, Helvetica, Arial, sans-serif">
  <defs>
    <!-- soft tints behind each ring -->
    <linearGradient id="aiFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="mlFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="dlFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <style>
      .title { font-size: 46px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 22px; font-weight: 600; fill: #475569; }
      .ringLabel { font-weight: 850; letter-spacing: 0.02em; }
      .aiLabel { font-size: 40px; fill: #6d28d9; }
      .mlLabel { font-size: 36px; fill: #047857; }
      .dlLabel { font-size: 34px; fill: #c2410c; }
      .tagline { font-size: 18px; font-weight: 600; fill: #334155; }
      .chip { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .relation { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .footnote { font-size: 16px; font-weight: 500; fill: #64748b; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>

  <!-- header -->
  <text x="800" y="74" class="title" text-anchor="middle">Artificial Intelligence, Machine Learning &amp; Deep Learning</text>
  <text x="800" y="112" class="subtitle" text-anchor="middle">Each one is a subset of the one before it.</text>

  <!-- relation strip -->
  <g transform="translate(800,150)">
    <rect x="-310" y="-22" width="620" height="44" rx="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="6" class="relation" text-anchor="middle">
      <tspan fill="#6d28d9">AI</tspan>
      <tspan dx="10" fill="#334155">⊃</tspan>
      <tspan dx="10" fill="#047857">Machine Learning</tspan>
      <tspan dx="10" fill="#334155">⊃</tspan>
      <tspan dx="10" fill="#c2410c">Deep Learning</tspan>
    </text>
  </g>

  <!-- AI ring (outer) -->
  <rect x="80" y="210" width="1440" height="730" rx="40"
        fill="url(#aiFill)" stroke="#7c3aed" stroke-width="5"/>
  <text x="120" y="262" class="ringLabel aiLabel">Artificial Intelligence</text>
  <text x="120" y="294" class="tagline">Any technique that lets machines mimic intelligent behavior.</text>

  <!-- AI-only example chips (live in the AI band, outside ML) -->
  <g transform="translate(120, 320)">
    <g>
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Rule-based systems</text>
    </g>
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Search &amp; planning</text>
    </g>
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Expert systems</text>
    </g>
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Optimization</text>
    </g>
  </g>

  <!-- right column: more AI-only chips -->
  <g transform="translate(1260, 320)">
    <g>
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Robotics control</text>
    </g>
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Game-playing AI</text>
    </g>
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Knowledge graphs</text>
    </g>
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Symbolic reasoning</text>
    </g>
  </g>

  <!-- ML ring (middle) -->
  <rect x="360" y="350" width="880" height="560" rx="34"
        fill="url(#mlFill)" stroke="#0d9488" stroke-width="5"/>
  <text x="400" y="400" class="ringLabel mlLabel">Machine Learning</text>
  <text x="400" y="430" class="tagline">Algorithms that learn patterns from data instead of being explicitly programmed.</text>

  <!-- ML-only example chips (in the ML band, outside DL) -->
  <g transform="translate(400, 454)">
    <g>
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Linear / logistic regression</text>
    </g>
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Decision trees</text>
    </g>
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Random forests</text>
    </g>
  </g>

  <g transform="translate(980, 454)">
    <g>
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Support vector machines</text>
    </g>
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">k-Nearest neighbors</text>
    </g>
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
      <text x="110" y="22" class="chip" text-anchor="middle">Clustering (k-means)</text>
    </g>
  </g>

  <!-- DL ring (inner) -->
  <rect x="540" y="610" width="520" height="270" rx="28"
        fill="url(#dlFill)" stroke="#ea580c" stroke-width="5"/>
  <text x="800" y="658" class="ringLabel dlLabel" text-anchor="middle">Deep Learning</text>
  <text x="800" y="686" class="tagline" text-anchor="middle">Neural networks with many layers — the engine behind today's AI boom.</text>

  <!-- DL chips -->
  <g transform="translate(575, 712)">
    <g>
      <rect x="0" y="0" width="135" height="32" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
      <text x="67.5" y="21" class="chip" text-anchor="middle">CNNs</text>
    </g>
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="135" height="32" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
      <text x="67.5" y="21" class="chip" text-anchor="middle">RNNs / LSTMs</text>
    </g>
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="135" height="32" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
      <text x="67.5" y="21" class="chip" text-anchor="middle">Transformers</text>
    </g>
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="200" height="32" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
      <text x="100" y="21" class="chip" text-anchor="middle">LLMs (ChatGPT, Claude)</text>
    </g>
    <g transform="translate(220, 44)">
      <rect x="0" y="0" width="215" height="32" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
      <text x="107.5" y="21" class="chip" text-anchor="middle">Diffusion (image, video)</text>
    </g>
  </g>

  <!-- footnote -->
  <text x="800" y="975" class="footnote" text-anchor="middle">
    All deep learning is machine learning. All machine learning is AI. But not all AI is machine learning — and not all ML is deep.
  </text>
</svg>
